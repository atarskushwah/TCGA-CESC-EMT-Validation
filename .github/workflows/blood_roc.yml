name: EMT bootstrap ROC reproducibility (synthetic smoke test)
on:
  push:
    paths:
      - 'blood_roc/**'
      - '.github/workflows/blood_roc.yml'
      - 'requirements.txt'
  pull_request:
    paths:
      - 'blood_roc/**'
      - '.github/workflows/blood_roc.yml'
      - 'requirements.txt'
  workflow_dispatch:
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install numpy pandas scipy scikit-learn
      - name: Test fixed-panel bootstrap pipeline with synthetic observations
        run: python blood_roc/test_bootstrap_roc.py
